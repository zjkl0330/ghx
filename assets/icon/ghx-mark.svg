<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    ghx 标记：GitHub 猫，反色版 —— 原来是深底浅色，现在白底深色。
    直接用 GitHub mark 原路径填充：它本身是「实心圆盘 − 猫」的复合路径，
    填深色就得到「深圆盘 + 白猫」，猫是镂空透出的底板色，正是反色效果。

    渐变必须 userSpaceOnUse：默认的 objectBoundingBox 会按 16×16 的包围盒归一化，
    在这里等于没渐变。
  -->
  <defs>
    <linearGradient id="disk" gradientUnits="userSpaceOnUse" x1="200" y1="150" x2="860" y2="900">
      <stop offset="0" stop-color="#242c36" />
      <stop offset="0.5" stop-color="#141a22" />
      <stop offset="1" stop-color="#080b10" />
    </linearGradient>
  </defs>

  <!-- GitHub mark 原图 16×16 的 viewBox，放大 53.5 倍后宽 856，四边各留 84 -->
  <g transform="translate(84 84) scale(53.5)">
    <path fill="url(#disk)" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
  </g>
</svg>
