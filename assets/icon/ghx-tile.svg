<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    ghx 底板：反色版。原来是深色玻璃牌 + 浅色标记，现在整块翻过来 ——
    底色走白，描边用近黑的低透明度，让白牌在浅色壁纸上也不至于糊成一片。
    标记（GitHub 猫）由 ghx-mark.svg 单独渲染后合入。
  -->
  <defs>
    <linearGradient id="bg" x1="0.08" y1="0" x2="0.92" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.46" stop-color="#fbfcfd" />
      <stop offset="1" stop-color="#eef1f5" />
    </linearGradient>
    <!-- 左上角一层冷白高光：纯白平板看着像「一张纸」，加这层才有玻璃厚度 -->
    <radialGradient id="aura" cx="0.26" cy="0.1" r="0.76">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.34" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- 底部压一层极淡的灰，模拟玻璃下沿的厚度 -->
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.62" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="1" stop-color="#0d1117" stop-opacity="0.07" />
    </linearGradient>
    <filter id="spec" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="58" />
    </filter>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="232" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)" />
    <rect width="1024" height="1024" fill="url(#aura)" />
    <ellipse cx="286" cy="52" rx="430" ry="132" fill="#ffffff" opacity="0.85" filter="url(#spec)" />
    <rect width="1024" height="1024" fill="url(#shade)" />
  </g>
  <!-- 内描边：白底上白线看不见，改用近黑的 9% 勾一圈 -->
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#0d1117" stroke-opacity="0.115" stroke-width="6" />
</svg>
