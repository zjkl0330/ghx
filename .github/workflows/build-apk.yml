name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # tag 触发时用 tag 名当版本，其余用 package.json。构建产物与关于页因此始终一致。
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${V}"

      - name: Sync version to gradle
        run: node scripts/sync-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type-check and build web
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="ghx-${{ steps.ver.outputs.version }}-debug.apk"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghx-${{ steps.ver.outputs.version }}
          path: ghx-${{ steps.ver.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 只有打 v* tag 才发 release，普通 push 只留 artifact
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ghx ${{ steps.ver.outputs.version }}
          files: ghx-${{ steps.ver.outputs.version }}-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
