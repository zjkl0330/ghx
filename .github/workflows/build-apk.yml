name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整历史，才能从 tag 注解取发版说明、并找到上一个 tag
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不用 android-actions/setup-android：它内部会执行 `sdkmanager tools`，
      # 而新版 runner 镜像已经移除了 tools 包，会直接失败。ubuntu-latest 自带 SDK。
      - name: Install SDK components
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            SDKM="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      # tag 触发时用 tag 名当版本，其余用 package.json。构建产物与关于页因此始终一致。
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "resolved version: ${V}"

      - name: Sync version to gradle
        run: node scripts/sync-version.mjs "${{ steps.ver.outputs.version }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Type-check and build web
        run: pnpm build

      - name: Sync Capacitor
        run: npx cap sync android

      # 固定签名：runner 的 debug keystore 每次不同，不固定就无法覆盖安装。
      # 四个 secret 缺一不可，缺了会在这里直接失败而不是悄悄用临时密钥签出废包。
      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.GHX_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.GHX_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.GHX_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHX_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少签名密钥 secret（GHX_KEYSTORE_BASE64 / GHX_KEYSTORE_PASSWORD / GHX_KEY_PASSWORD）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ghx-release.jks"
          {
            echo "GHX_KEYSTORE_PATH=$RUNNER_TEMP/ghx-release.jks"
            echo "GHX_KEYSTORE_PASSWORD=$KEYSTORE_PASS"
            echo "GHX_KEY_ALIAS=${KEY_ALIAS:-ghx}"
            echo "GHX_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          SRC=android/app/build/outputs/apk/debug/app-debug.apk
          OUT="ghx-${{ steps.ver.outputs.version }}-debug.apk"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"

      # 指纹硬编码在这里是有意的：签错密钥的包装不上，必须在发版前拦住。
      - name: Verify signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          OUT="ghx-${{ steps.ver.outputs.version }}-debug.apk"
          "$APKSIGNER" verify "$OUT"
          FP="$("$APKSIGNER" verify --print-certs "$OUT" 2>&1 | grep -m1 'SHA-256 digest' | awk '{print $NF}')"
          EXPECT="fd6a8ea4445b0ada2c06065f38e9c8ea011df02c1eb484abd5ab6824c79eb2de"
          echo "APK 证书 SHA-256: $FP"
          if [ "$FP" != "$EXPECT" ]; then
            echo "::error::签名指纹不匹配，期望 $EXPECT，实际 $FP"
            exit 1
          fi
          echo "签名指纹校验通过"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghx-${{ steps.ver.outputs.version }}
          path: ghx-${{ steps.ver.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 发版说明直接取 tag 注解，避免每个 Release 只有一行 changelog 链接
      - name: Collect release notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # checkout 有时只留轻量引用，显式取回注解 tag，才能拿到发版说明
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" >/dev/null 2>&1 || true
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          if [ "$(git cat-file -t "$TAG" 2>/dev/null)" = "tag" ]; then
            NOTES="$(git for-each-ref --format='%(contents)' "refs/tags/$TAG")"
          else
            # 兜底：annotated 消息取不到时，用区间内的提交说明拼一份
            RANGE="${PREV:+${PREV}..}${TAG}"
            NOTES="$(git log --no-merges --pretty='%s%n%n%b' "$RANGE")"
          fi

          {
            echo "body<<GHX_EOF"
            echo "$NOTES"
            echo ""
            echo "安装包：ghx-${TAG#v}-debug.apk（覆盖安装，本地令牌与审计日志不丢）"
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            fi
            echo "GHX_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "已收集 ${TAG} 的发版说明（上一版 ${PREV:-无}，来源 $([ "$(git cat-file -t "$TAG")" = tag ] && echo tag注解 || echo 提交记录)）"

      # 只有打 v* tag 才发 release，普通 push 只留 artifact
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ghx ${{ steps.ver.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: ghx-${{ steps.ver.outputs.version }}-debug.apk
          fail_on_unmatched_files: true
